# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    properties:
      coinpaprikaApiKey:
        type: string
        description: "Optional CoinPaprika API key for paid-tier features"
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/bin.js'], env: config.coinpaprikaApiKey ? { COINPAPRIKA_API_KEY: config.coinpaprikaApiKey } : {} })
  exampleConfig: {}
